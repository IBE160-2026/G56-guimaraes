name: CI - Test & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Sjekk ut kode
      uses: actions/checkout@v4

    - name: Sett opp Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Installer avhengigheter
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff pytest-cov

    - name: Kjør statisk kodeanalyse (Ruff linter)
      run: |
        ruff check src/ tests/ --select E,F,W --ignore E501

    - name: Kjør enhetstester med kodedekning (pytest-cov)
      run: |
        pytest -v tests/ --cov=src --cov-report=term-missing --cov-fail-under=80
